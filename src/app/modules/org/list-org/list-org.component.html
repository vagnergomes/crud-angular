<div class="container">
  <h1>Organizações</h1>

  <table mat-table [dataSource]="orgs" class="mat-elevation-z8">

    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef>Name</th>
      <td mat-cell *matCellDef="let element">{{element.name}}</td>
    </ng-container>

    <ng-container matColumnDef="description">
      <th mat-header-cell *matHeaderCellDef>Descrição</th>
      <td mat-cell *matCellDef="let element">{{element.description}}</td>
    </ng-container>

    <ng-container matColumnDef="type">
      <th mat-header-cell *matHeaderCellDef>Tipo</th>
      <td mat-cell *matCellDef="let element">{{element.type}}</td>
    </ng-container>

    <ng-container matColumnDef="n_register">
      <th mat-header-cell *matHeaderCellDef>Nº Registro</th>
      <td mat-cell *matCellDef="let element">{{element.n_register}}</td>
    </ng-container>

    <ng-container matColumnDef="city">
      <th mat-header-cell *matHeaderCellDef>Cidade</th>
      <td mat-cell *matCellDef="let element">{{element.city}}</td>
    </ng-container>

    <ng-container matColumnDef="province">
      <th mat-header-cell *matHeaderCellDef>Estado</th>
      <td mat-cell *matCellDef="let element">{{element.province}}</td>
    </ng-container>

    <ng-container matColumnDef="visible">
      <th mat-header-cell *matHeaderCellDef>Visível</th>
      <td mat-cell *matCellDef="let element">{{element.visible}}</td>
    </ng-container>

    <ng-container matColumnDef="active">
      <th mat-header-cell *matHeaderCellDef>Ativo</th>
      <td mat-cell *matCellDef="let element">{{element.active}}</td>
    </ng-container>

    <ng-container matColumnDef="details">
      <th mat-header-cell *matHeaderCellDef>Details</th>
      <td mat-cell *matCellDef="let element">
        <button class="btn btn-sm btn-info" (click)="openDetails(element)"  >
          <i class="fa fa-search" ></i>Detalhes
        </button>
      </td>
    </ng-container>
    <ng-container matColumnDef="editar">
      <th mat-header-cell *matHeaderCellDef>Editar</th>
      <td mat-cell *matCellDef="let element">
        <button class="btn btn-sm btn-warning" routerLink="/org/edit/{{element.id}}"  >
          <i class="fa fa-edit" ></i>Editar
        </button>
      </td>
    </ng-container>
    <ng-container matColumnDef="deletar">
      <th mat-header-cell *matHeaderCellDef>deletar</th>
      <td mat-cell *matCellDef="let element">
        <button mat-button class="btn btn-sm btn-danger"  >
          <i class="fa fa-remove" ></i>Deletar
        </button>
      </td>
    </ng-container>


    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>

  </div>
