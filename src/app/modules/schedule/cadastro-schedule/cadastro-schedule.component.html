<div class="container">
  <div class="row box-cadastro">
    <h3>Estamos chegando.</h3>
    <form class="mt-5" #frm="ngForm">
      <div class="form">
        <input type="text"
        class="form-control  cadastro"
        id="name"
        name="name"
        placeholder="Nome"
        required="true"
        [(ngModel)]="schedule.name"
        />
      </div>

      <div class="form">
        <input type="text"
        class="form-control  cadastro"
        id="description"
        name="description"
        placeholder="Descrição"
        [(ngModel)]="schedule.description"
        />
      </div>


      <div class="form">
        <h6>Ativo</h6>
        <mat-slide-toggle
          id="active"
          name="active"
          class="example-margin"
          [color]="color"
          [(ngModel)]="schedule.active"
          [disabled]="disabled">
        </mat-slide-toggle>
      </div>

      <div class="form-group">
        <mat-form-field >
          <mat-label>Organização</mat-label>
          <mat-select [(ngModel)]="schedule.org"
          id="org"
          name="org"
          required="true" >
            <mat-option *ngFor="let org of orgs" [value]="org">{{org.name}}</mat-option>
          </mat-select>
        </mat-form-field>
      </div>

      <div fxLayout="row wrap">
        <div fxFlex="50" fxFill fxLayoutAlign="start center">
          <mat-form-field > <!--appearance="fill"-->
            <mat-label>Data</mat-label>
            <input matInput [matDatepicker]="picker" formControlName="dataForm" name="dataForm" required="true" >
            <mat-hint>MM/DD/YYYY</mat-hint>
            <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
            <mat-datepicker #picker ></mat-datepicker>
        </mat-form-field>
      </div>

      <div fxFlex="50" fxFill fxLayoutAlign="start center">
        <mat-form-field >
          <mat-label> Horário </mat-label>
          <input type="time" matInput formControlName="horaForm" name="horaForm" readonly="true" #time>
        </mat-form-field>
      </div>
    </div>

      <button type="submit" class="btn btn-cadastro btn-lg"
      [disabled]="frm.invalid"
      (click)="criar()">Cadastrar</button>

    </form>
  </div>
</div>
