<mat-card class="example-card">

  <div *ngIf="schedule" class="container">
    <h1>Detalhes: {{schedule.name}}</h1>
  <form method="post" #frm="ngForm"  >
    <div class="form-group">
      <label for="name">Nome: </label>
      <label for="quantity">{{schedule.name}}</label>
    </div>

    <div class="form-group">
      <label for="quantity">Descrição: </label>
      <label for="quantity">{{schedule.description}}</label>
    </div>

    <div class="form-group">
      <label for="price">Org: </label>
      <label for="quantity">{{schedule.org.name}}</label>
    </div>

    <div class="form-group">
      <label for="price">Tipo: </label>
      <label for="quantity">{{schedule.active}}</label>
    </div>


    <button type="submit" class="btn btn-primary"
    [disabled]="frm.invalid" >Atulizar</button>
  </form>

  </div>
  </mat-card>
